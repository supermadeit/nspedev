<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>NSPE.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #0a2540;
      overflow: hidden;
    }

    body {
      min-height: 100dvh;
      position: relative;
      background:
        radial-gradient(80vmax 60vmax at 30% 30%, #cfeafe 0%, transparent 60%),
        radial-gradient(70vmax 55vmax at 75% 70%, #a9d5f5 0%, transparent 65%),
        linear-gradient(180deg, #bfe0f7 0%, #87b8e0 100%);
      filter: saturate(1.05);
    }

    /* soft blurred orbs for depth */
    body::before,
    body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.85;
      pointer-events: none;
    }
    body::before {
      width: 60vmax;
      height: 60vmax;
      top: -20vmax;
      left: -15vmax;
      background: #d8ecfb;
    }
    body::after {
      width: 55vmax;
      height: 55vmax;
      bottom: -20vmax;
      right: -10vmax;
      background: #9ec9ec;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(4px, 0.6vw, 8px);
    }

    .line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0;
    }

    .tag {
      font-weight: 500;
      letter-spacing: 0;
      color: #0a2540;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .top .tag { font-size: clamp(14px, 3.2vw, 24px); }
    .bot .tag { font-size: clamp(18px, 4.2vw, 32px); }

    footer {
      position: fixed;
      bottom: 14px;
      left: 16px;
      z-index: 2;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: rgba(10, 37, 64, 0.65);
    }

    @media (max-width: 480px) {
      footer { font-size: 10px; left: 12px; bottom: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="stack">
      <div class="line top">
        <span class="tag">{sports}</span><span class="tag">{world}</span>
      </div>
      <div class="line bot">
        <span class="tag">{come}</span><span class="tag">{back}</span><span class="tag">{soon}</span>
      </div>
    </div>
  </main>

  <footer>{madeit technologies}</footer>
</body>
</html>
