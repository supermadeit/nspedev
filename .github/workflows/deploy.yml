name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure maintenance mode
        env:
          MAINTENANCE_MODE: ${{ vars.MAINTENANCE_MODE }}
        run: |
          if [ "${MAINTENANCE_MODE,,}" = "true" ]; then
            echo "Maintenance mode: ON — rewriting all routes to /maintenance.html"
            printf '/*  /maintenance.html  200\n' > public/_redirects
          else
            echo "Maintenance mode: OFF — using app SPA fallback"
          fi
          echo "--- public/_redirects ---"
          cat public/_redirects

      - name: Build
        run: npm run build
        env:
          VITE_NSPE_API_BASE: https://api.nspe.dev
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nspe-dev --branch=main
